<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fresh 80 review · Korvia Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f2e9;color:#14261f}.shell{width:min(1100px,calc(100% - 32px));margin:auto;padding:60px 0}h1{font-size:clamp(2.5rem,7vw,5.5rem);line-height:.95;letter-spacing:-.06em;margin:0 0 20px}p{color:#62706a;max-width:760px}.notice{background:#14261f;color:#fff;padding:14px 5vw;font-size:.8rem}.notice b{color:#d7ff68}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:42px}.card{background:#fff;border:1px solid #d9ddd7;padding:22px;text-decoration:none;display:flex;justify-content:space-between;gap:20px;align-items:center}.card:hover{border-color:#14261f;transform:translateY(-2px)}.card b{display:block}.card span{font-size:.75rem;color:#738078}.card i{font-style:normal;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="notice"><b>Internal review dashboard</b> · 80 unofficial concepts</div><main class="shell"><h1>Four countries.<br>Eighty tailored concepts.</h1><p>Twenty concepts each for Tanzania, Uganda, Rwanda and Burundi. Burundi opens in French and includes a complete English version. Photography is illustrative pending organization approval.</p><div class="grid" id="grid"></div></main><script src="prospects.js"></script><script src="fresh-80-prospects.js"></script><script>const keys=Object.keys(PROSPECTS).filter(k=>/^(tz|ug|rw|bi)-80-/.test(k)).sort();const country=k=>k.startsWith('tz-')?'Tanzania':k.startsWith('ug-')?'Uganda':k.startsWith('rw-')?'Rwanda':'Burundi';document.getElementById('grid').innerHTML=keys.map(k=>{const v=PROSPECTS[k];return `<a class="card" href="index.html?for=${k}" target="_blank"><div><b>${v.name}</b><span>${country(k)} · ${v.tags.join(' · ')}</span></div><i>View ↗</i></a>`}).join('');</script></body></html>
