<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Burundi · Revue Korvia</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f2e9;color:#14261f}.top{background:#14261f;color:#fff;padding:13px 5vw;font-size:.78rem}.top b{color:#d7ff68}.shell{width:min(1050px,calc(100% - 32px));margin:auto;padding:60px 0}h1{font-size:clamp(3rem,8vw,6rem);line-height:.92;letter-spacing:-.06em;margin:0}p{color:#65706a;max-width:700px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}.card{background:#fff;border:1px solid #d6dbd5;padding:20px;text-decoration:none;color:inherit;display:flex;justify-content:space-between;gap:18px}.card:hover{border-color:#14261f}.card b,.card span{display:block}.card span{color:#738078;font-size:.74rem;margin-top:4px}.card i{font-style:normal;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>Revue interne</b> · 15 concepts Burundi · aucun email envoyé</div><main class="shell"><h1>Concepts Burundi</h1><p>Chaque organisation recevra uniquement son propre lien après validation. Français complet, avec Kirundi et English proposés après validation de la traduction.</p><div class="grid" id="grid"></div></main><script src="prospects.js"></script><script src="institutional-prospects.js"></script><script src="burundi-prospects.js"></script><script>const rows=Object.entries(PROSPECTS).filter(([k])=>k.startsWith('bi-'));document.getElementById('grid').innerHTML=rows.map(([k,v])=>`<a class="card" href="index.html?for=${k}" target="_blank"><div><b>${v.name}</b><span>${v.tags.join(' · ')}</span></div><i>Voir ↗</i></a>`).join('');</script></body></html>
